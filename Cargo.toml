[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [
  "crates/mush-agent",
  "crates/mush-ai",
  "crates/mush-cli",
  "crates/mush-daemon",
  "crates/mush-ext",
  "crates/mush-kernel",
  "crates/mush-lsp",
  "crates/mush-mcp",
  "crates/mush-runtime",
  "crates/mush-sandbox",
  "crates/mush-session",
  "crates/mush-supervisor",
  "crates/mush-sync",
  "crates/mush-tools",
  "crates/mush-treesitter",
  "crates/mush-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# internal crates
mush-ai = { path = "crates/mush-ai" }
mush-agent = { path = "crates/mush-agent" }
mush-tools = { path = "crates/mush-tools" }
mush-session = { path = "crates/mush-session" }
mush-sync = { path = "crates/mush-sync" }
mush-runtime = { path = "crates/mush-runtime" }
mush-daemon = { path = "crates/mush-daemon" }
mush-supervisor = { path = "crates/mush-supervisor" }
mush-ext = { path = "crates/mush-ext" }
mush-mcp = { path = "crates/mush-mcp" }
mush-kernel = { path = "crates/mush-kernel" }
mush-tui = { path = "crates/mush-tui" }
mush-treesitter = { path = "crates/mush-treesitter" }
mush-lsp = { path = "crates/mush-lsp" }
mush-notify = { path = "crates/mush-notify" }
mush-sandbox = { path = "crates/mush-sandbox" }
landlock = "0.4.7"
seccompiler = "0.5.0"
libc = "0.2"
rustix = { version = "1.1.5", features = ["process", "time"] }

# async
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"

# http + streaming
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "rustls",
] }
# client middleware: lets us wrap every http client with a logging layer
# that journals each request + response (see mush-ai::http)
reqwest-middleware = { version = "0.5", features = ["json"] }
http = "1"
axum = "0.8.9"
# time
chrono = { version = "0.4", default-features = false, features = [
  "std",
  "serde",
  "clock",
] }

# serialisation
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
similar = "3"
semver = "1.0.28"
toml = "1.1"

# json schema generation for the nix module codegen pipeline
# (see crates/mush-cli/src/bin/mush_config_schema.rs). nixcfg-rs wraps
# schemars and applies the `x-nixcfg-*` extensions + default merging
schemars = "1"
nixcfg-rs = "0.3"

# derive helpers
derive_more = { version = "2.1", features = [
  "display",
  "from",
  "deref",
  "as_ref",
  "into",
] }
# compile-time-checked builders for structs with many optional fields
bon = "3.10"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# error handling
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
color-eyre = "0.6"

# tui
ratatui = { version = "0.30.2", features = [
  "unstable-rendered-line-info",
  "scrolling-regions",
] }
unicode-width = "0.2"
# emoji character property lookup for the forbidden-chars "emoji" class
unicode-properties = { version = "0.1.4", default-features = false, features = [
  "emoji",
] }
# fold the text a model echoes back onto the text a file holds
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13"
crossterm = { version = "0.29", features = ["osc52"] }

# parses bash/cargo/eza/jj style ANSI SGR escapes out of tool output and
# into styled ratatui spans, so the inline tool preview shows colour
# instead of raw `\x1b[31m` garbage
ansi-to-tui = "8.0.1"
pulldown-cmark = "0.13.4"

# configurable keybind parsing ("ctrl-k", "alt-enter", ...). wraps
# crossterm so bindings loaded from the user's config.toml land in the
# same KeyEvent shape the input handlers already match against
crokey = { version = "1.5", features = ["serde"] }

# cli
anstream = "1.0.0"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
clap_complete_nushell = "4.6.2"
# open URLs in the user's browser (used by /login)
open = "5"

# secure credential storage. keyring-core is the platform-independent
# api; per-platform store crates (apple-native, windows-native,
# linux-keyutils) implement actual storage. file fallback handles
# headless / containerised hosts where the os keychain isn't available
keyring-core = "1"
linux-keyutils-keyring-store = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
windows-native-keyring-store = "1"

# terminal
atty = "0.2"

# parallelism
rayon = "1.12"
regex = "1.13"

# fast non-crypto hash for internal maps
rustc-hash = "2.1"

# crypto + encoding
sha2 = "0.11"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
flate2 = "1.1.10"
getrandom = "0.4"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "bmp",
] }
notify = "8"
urlencoding = "2"

# profiling
tracing-chrome = { version = "0.7", default-features = false }

# testing
pretty_assertions = "1"
tempfile = "3"
filetime = "0.2"
criterion = { version = "0.8", features = ["html_reports"] }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
