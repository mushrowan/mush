[package]
name = "mush-cli"
description = "the mush binary"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
signal = ["mush-tui/signal"]
tokio-console = ["dep:console-subscriber"]
profiling = ["dep:tracing-chrome"]

# cargo-machete can't see through the package/lib name mismatch: the
# `nixcfg-rs` package provides the `nixcfg` lib, used in config_schema.rs
# via `nixcfg::emit`. ignore it so the unused-dep check stays clean.
[package.metadata.cargo-machete]
ignored = ["nixcfg-rs"]

[[bin]]
name = "mush"
path = "src/main.rs"

[[bin]]
name = "mush-config-schema"
path = "src/bin/config_schema.rs"

[lib]
path = "src/lib.rs"

[dependencies]
mush-ai.workspace = true
mush-agent.workspace = true
mush-tools.workspace = true
mush-kernel.workspace = true
mush-session.workspace = true
mush-ext.workspace = true
mush-mcp.workspace = true
mush-tui.workspace = true
mush-daemon.workspace = true
mush-treesitter.workspace = true
mush-lsp.workspace = true
tokio.workspace = true
anstream.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
schemars.workspace = true
nixcfg-rs.workspace = true
futures.workspace = true
color-eyre.workspace = true
toml.workspace = true
atty.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
reqwest.workspace = true
open.workspace = true
console-subscriber = { version = "0.5", optional = true }
tracing-chrome = { workspace = true, optional = true }

[dev-dependencies]
mush-supervisor.workspace = true
tempfile.workspace = true
rustix = { workspace = true, features = ["pty", "termios"] }

[lints]
workspace = true
