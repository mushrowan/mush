[package]
name = "mush-tui"
description = "terminal UI for mush"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
signal = ["dep:mush-notify"]

[dependencies]
mush-notify = { workspace = true, optional = true }
mush-ai.workspace = true
mush-agent.workspace = true
mush-mcp.workspace = true
mush-session.workspace = true
mush-runtime.workspace = true
mush-supervisor.workspace = true
mush-ext.workspace = true
mush-tools.workspace = true
tokio.workspace = true
ratatui.workspace = true
crossterm.workspace = true
ansi-to-tui.workspace = true
crokey.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
async-trait.workspace = true
similar.workspace = true
syntect = { version = "5.3.0", default-features = false, features = [
  "default-syntaxes",
  "default-themes",
  "regex-fancy",
] }
base64.workspace = true
image.workspace = true
notify.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
pulldown-cmark.workspace = true
toml.workspace = true
open.workspace = true
tracing.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
ratatui-image = { version = "11.1.0", default-features = false, features = [
  "crossterm",
  "image-defaults",
] }
nucleo-matcher = "0.3"
chrono.workspace = true
regex.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion.workspace = true
# start_paused test clocks for the oauth browser-login timeout
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[[bench]]
name = "render_hot_paths"
harness = false

[lints]
workspace = true
